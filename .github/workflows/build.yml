name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release, tagged v<version from tauri.conf.json>"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: linux-x64
          - os: windows-latest
            engine: win-x64
          - os: macos-latest
            engine: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: node scripts/fetch-engines.mjs ${{ matrix.engine }}
      - run: cargo test -p localpdf-core
      - name: UI typecheck
        if: matrix.os == 'ubuntu-latest'
        run: npm ci && npm run build

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: node scripts/fetch-engines.mjs win-x64
      - run: npx tauri build --bundles nsis
      - name: Install, check menu, uninstall, check menu is gone
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S"
          $root = "HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\LocalPDF"
          $cmd = (Get-ItemProperty "$root\shell\02compress\command").'(default)'
          if (-not $cmd) { throw "Explorer menu was not registered by the installer" }
          Write-Host "Compress verb: $cmd"
          foreach ($ext in ".png", ".jpg", ".docx", ".xlsx", ".pptx") {
            if (-not (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\LocalPDF.ToPdf")) { throw "missing Convert to PDF for $ext" }
          }
          $installDir = Split-Path ($cmd -replace '^"([^"]+)".*', '$1')
          if (-not (Test-Path "$installDir\engines\pdfium.dll")) { throw "pdfium.dll not installed" }
          Start-Process -Wait -FilePath "$installDir\uninstall.exe" -ArgumentList "/S"
          # The NSIS uninstaller relaunches itself from %TEMP%; wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $root) { throw "Explorer menu still present after uninstall" }
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.png\shell\LocalPDF.ToPdf") { throw "image verb still present after uninstall" }
          Write-Host "Register/unregister round trip OK"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: LocalPDF ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: target/release/bundle/nsis/*-setup.exe

  macos:
    name: macOS app (universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: node scripts/fetch-engines.mjs mac-univ
      - run: npx tauri build --target universal-apple-darwin
      - name: Register Quick Actions, validate, unregister
        run: |
          APP=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          test -f "$APP/Contents/Resources/engines/libpdfium.dylib"
          lipo -info "$BIN"
          "$BIN" --register
          ls ~/Library/Services
          n=$(ls -d ~/Library/Services/LocalPDF\ -\ *.workflow | wc -l | tr -d ' ')
          test "$n" = "8"
          for w in ~/Library/Services/LocalPDF\ -\ *.workflow; do
            plutil -lint "$w/Contents/Info.plist" "$w/Contents/document.wflow"
          done
          grep -q "Contents/MacOS" ~/Library/Services/LocalPDF\ -\ Compress.workflow/Contents/document.wflow
          "$BIN" --unregister
          if ls ~/Library/Services/LocalPDF\ -\ *.workflow >/dev/null 2>&1; then echo "still registered"; exit 1; fi
          echo "Register/unregister round trip OK"
          du -sh "$APP" target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: LocalPDF ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
