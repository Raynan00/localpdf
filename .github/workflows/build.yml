name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release, tagged v<version from tauri.conf.json>. An existing release with that tag is replaced."
        type: boolean
        default: false
      lite:
        description: "Also build the Windows Lite installer (no bundled Office converter)"
        type: boolean
        default: false
      notes:
        description: "Only update the text of the existing release from .github/RELEASE_NOTES.md (no rebuild)"
        type: boolean
        default: false
      msix:
        description: "Build the Microsoft Store package (MSIX) for Partner Center product 9NL235Q73VTR"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LOCALPDF_ENGINE_CACHE: ${{ github.workspace }}/.engine-cache

jobs:
  test:
    name: engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: linux-x64
          - os: windows-latest
            engine: win-x64
          - os: macos-latest
            engine: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - uses: actions/cache@v4
        with:
          path: .engine-cache
          key: engines-${{ matrix.engine }}-${{ hashFiles('scripts/fetch-engines.mjs') }}
      - run: node scripts/fetch-engines.mjs ${{ matrix.engine }}
      - name: Engine tests (Office conversion runs against the bundled LibreOffice)
        shell: bash
        run: |
          case "${{ matrix.engine }}" in
            win-x64)   export LOCALPDF_SOFFICE="$PWD/src-tauri/engines/libreoffice/program/soffice.exe" ;;
            mac-arm64) export LOCALPDF_SOFFICE="$PWD/src-tauri/engines-mac/LibreOffice.app/Contents/MacOS/soffice" ;;
          esac
          cargo test -p localpdf-core
      - name: UI typecheck
        if: matrix.os == 'ubuntu-latest'
        run: npm ci && npm run build

  release-notes:
    if: github.event_name == 'workflow_dispatch' && inputs.notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the release text in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file .github/RELEASE_NOTES.md

  prepare-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Remove an existing release and tag with the same version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.v.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          git push origin --delete "refs/tags/${{ steps.v.outputs.tag }}" || true

  windows:
    name: Windows installer
    needs: [test, prepare-release]
    if: always() && needs.test.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - uses: actions/cache@v4
        with:
          path: .engine-cache
          key: engines-win-x64-${{ hashFiles('scripts/fetch-engines.mjs') }}
      - run: npm ci
      - run: node scripts/fetch-engines.mjs win-x64
      - run: npx tauri build --bundles nsis
      - name: Install, check menu and bundled engines, convert Office files, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S"
          $root = "HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\LocalPDF"
          $cmd = (Get-ItemProperty "$root\shell\02compress\command").'(default)'
          if (-not $cmd) { throw "Explorer menu was not registered by the installer" }
          Write-Host "Compress verb: $cmd"
          foreach ($ext in ".png", ".jpg", ".docx", ".xlsx", ".pptx") {
            if (-not (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\LocalPDF.ToPdf")) { throw "missing Convert to PDF for $ext" }
          }
          $installDir = Split-Path ($cmd -replace '^"([^"]+)".*', '$1')
          if (-not (Test-Path "$installDir\engines\pdfium.dll")) { throw "pdfium.dll not installed" }
          $soffice = "$installDir\engines\libreoffice\program\soffice.exe"
          if (-not (Test-Path $soffice)) { throw "bundled LibreOffice not installed" }
          $size = (Get-ChildItem $installDir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Installed size: $([math]::Round($size / 1MB)) MB"
          # Convert Word, Excel and PowerPoint with the installed copy.
          $env:LOCALPDF_SOFFICE = $soffice
          cargo test -p localpdf-core --test ops office_to_pdf -- --nocapture
          Start-Process -Wait -FilePath "$installDir\uninstall.exe" -ArgumentList "/S"
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $root) { throw "Explorer menu still present after uninstall" }
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.png\shell\LocalPDF.ToPdf") { throw "image verb still present after uninstall" }
          Write-Host "Install / convert / uninstall round trip OK"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LocalPDF ${{ needs.prepare-release.outputs.tag || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: target/release/bundle/nsis/*-setup.exe

  windows-lite:
    name: Windows Lite installer
    needs: [test, prepare-release]
    if: always() && needs.test.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && github.event_name == 'workflow_dispatch' && (inputs.lite || inputs.release)
    runs-on: windows-latest
    env:
      LOCALPDF_NO_OFFICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - run: npm ci
      - run: node scripts/fetch-engines.mjs win-x64
      - run: npx tauri build --bundles nsis
      - name: Name it Lite, install, check menu, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          $lite = Join-Path $setup.DirectoryName ($setup.Name -replace '-setup\.exe$', '-lite-setup.exe')
          Move-Item $setup.FullName $lite
          Write-Host "Installer: $(Split-Path $lite -Leaf) ($([math]::Round((Get-Item $lite).Length / 1MB, 1)) MB)"
          Start-Process -Wait -FilePath $lite -ArgumentList "/S"
          $root = "HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\LocalPDF"
          $cmd = (Get-ItemProperty "$root\shell\02compress\command").'(default)'
          if (-not $cmd) { throw "Explorer menu was not registered by the installer" }
          $installDir = Split-Path ($cmd -replace '^"([^"]+)".*', '$1')
          if (-not (Test-Path "$installDir\engines\pdfium.dll")) { throw "pdfium.dll not installed" }
          if (Test-Path "$installDir\engines\libreoffice") { throw "Lite build should not contain LibreOffice" }
          Start-Process -Wait -FilePath "$installDir\uninstall.exe" -ArgumentList "/S"
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $root) { throw "Explorer menu still present after uninstall" }
          Write-Host "Lite install / uninstall round trip OK"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-windows-x64-lite
          path: target/release/bundle/nsis/*-lite-setup.exe
      - if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LocalPDF ${{ needs.prepare-release.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          files: target/release/bundle/nsis/*-lite-setup.exe

  windows-msix:
    name: Microsoft Store package (MSIX)
    needs: [test]
    if: github.event_name == 'workflow_dispatch' && inputs.msix
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Raynan.LocalPDF' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=6CE95327-903C-4CB6-8182-CC1C7295DE2C' }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Raynan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - uses: actions/cache@v4
        with:
          path: .engine-cache
          key: engines-win-x64-${{ hashFiles('scripts/fetch-engines.mjs') }}
      - run: npm ci
      - run: node scripts/fetch-engines.mjs win-x64
      - name: Explorer menu handler tests
        run: cargo test -p localpdf-shell
      - run: npx tauri build --no-bundle
      - run: cargo build -p localpdf-shell --release
      - name: Package (unsigned for the Store, plus a test-signed copy)
        shell: pwsh
        run: scripts/msix-package.ps1 -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -TestCertificate
      - name: Install the test-signed package, check files and menu handlers, uninstall
        shell: pwsh
        run: |
          Import-Certificate -FilePath target\msix\LocalPDF-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path (Get-ChildItem target\msix\*_test-signed.msix).FullName
          $pkg = Get-AppxPackage -Name $env:MSIX_IDENTITY_NAME
          if (-not $pkg) { throw "package did not install" }
          $dir = $pkg.InstallLocation
          Write-Host "Installed $($pkg.PackageFullName) at $dir"
          foreach ($f in "LocalPDF.exe", "localpdf_shell.dll", "engines\pdfium.dll", "engines\libreoffice\program\soffice.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f in the package" }
          }
          $size = (Get-ChildItem $dir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Installed size: $([math]::Round($size / 1MB)) MB"
          # The manifest registers the two menu classes with a COM surrogate; activating
          # them from outside the package proves the registration and the DLL load.
          foreach ($clsid in "{c8dffbbc-3cb0-44c6-9ef0-ee8c214d518b}", "{f4c974e7-f94c-4cb5-9771-cee5a8bed823}") {
            try {
              $o = [Activator]::CreateInstance([type]::GetTypeFromCLSID($clsid))
              Write-Host "COM class $clsid activated"
              [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($o)
            } catch {
              Write-Warning "COM class $clsid did not activate from outside the package: $($_.Exception.Message)"
            }
          }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name $env:MSIX_IDENTITY_NAME) { throw "package still installed" }
          Write-Host "MSIX install / uninstall round trip OK"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-msix
          path: |
            target/msix/*.msix
            target/msix/*.cer

  macos:
    name: macOS app (${{ matrix.arch }})
    needs: [test, prepare-release]
    if: always() && needs.test.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
            triple: aarch64-apple-darwin
            engine: mac-arm64
          - arch: x64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
            engine: mac-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.arch }}
      - uses: actions/cache@v4
        with:
          path: .engine-cache
          key: engines-${{ matrix.engine }}-${{ hashFiles('scripts/fetch-engines.mjs') }}
      - run: npm ci
      - run: node scripts/fetch-engines.mjs ${{ matrix.engine }}
      - run: npx tauri build --target ${{ matrix.triple }} --bundles app
      - name: Bundle LibreOffice into the app and build the DMG
        run: scripts/macos-package.sh target/${{ matrix.triple }}/release/bundle/macos/LocalPDF.app ${{ matrix.arch }}
      - name: Check engines, convert Office files, register and unregister Quick Actions
        run: |
          APP=target/${{ matrix.triple }}/release/bundle/macos/LocalPDF.app
          BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          test -f "$APP/Contents/Resources/engines/libpdfium.dylib"
          test -x "$APP/Contents/Resources/LibreOffice.app/Contents/MacOS/soffice"
          lipo -info "$BIN"
          # Convert Word, Excel and PowerPoint with the copy inside the app.
          LOCALPDF_SOFFICE="$PWD/$APP/Contents/Resources/LibreOffice.app/Contents/MacOS/soffice" \
            cargo test -p localpdf-core --test ops office_to_pdf -- --nocapture
          "$BIN" --register
          n=$(ls -d ~/Library/Services/LocalPDF\ -\ *.workflow | wc -l | tr -d ' ')
          test "$n" = "8"
          for w in ~/Library/Services/LocalPDF\ -\ *.workflow; do
            plutil -lint "$w/Contents/Info.plist" "$w/Contents/document.wflow"
          done
          grep -q "Contents/MacOS" ~/Library/Services/LocalPDF\ -\ Compress.workflow/Contents/document.wflow
          "$BIN" --unregister
          if ls ~/Library/Services/LocalPDF\ -\ *.workflow >/dev/null 2>&1; then echo "still registered"; exit 1; fi
          echo "Engines / convert / Quick Actions round trip OK"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-macos-${{ matrix.arch }}
          path: target/dmg/*.dmg
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LocalPDF ${{ needs.prepare-release.outputs.tag || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: target/dmg/*.dmg
