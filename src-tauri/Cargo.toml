[package]
name = "localpdf"
description = "Offline PDF tools in the Windows Explorer and macOS Finder right-click menu"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
localpdf-core = { path = "../crates/core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Storage_Packaging_Appx", "Win32_Foundation"] }

[features]
# Lets `tauri dev` serve the UI from Vite.
custom-protocol = ["tauri/custom-protocol"]
